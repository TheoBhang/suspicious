  /api/campaigns/classification-counts/:
    get:
      operationId: campaign_classification_counts
      description: |-
        Return aggregate message counts by top-level classification for the current Chroma collection.

        **Label semantics**
        - `SAFE`: benign content.
        - `UNWANTED`: unwanted but not dangerous content.
        - `DANGEROUS`: confirmed dangerous content.

        **Aggregation rule**
        - Records labeled `SUSPICIOUS` are folded into `UNWANTED` for this endpoint.
        - This is intentional to preserve the existing frontend contract, which expects three buckets only: `SAFE`, `UNWANTED`, and `DANGEROUS`.

        **Implementation note**
        - Counts are computed by scanning metadata and normalizing the `classification` field rather than issuing multiple per-label queries.
      summary: Get campaign classification counts
      tags:
      - Campaigns
      security:
      - knoxApiToken: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignClassificationCounts'
              examples:
                ClassificationCounts:
                  value:
                    SAFE: 128
                    UNWANTED: 41
                    DANGEROUS: 9
                  summary: Classification counts
          description: Three-bucket classification counts. `SUSPICIOUS` is aggregated
            into `UNWANTED`.
  /api/campaigns/mail-volume/:
    get:
      operationId: campaign_mail_volume
      description: |-
        Return daily mail volume for the last 15 UTC days and inferred campaign date bands.

        **Label semantics**
        - `dangerous` counts only records whose normalized `classification` is `DANGEROUS`.
        - `non_danger` counts every other classified or unclassified record that has a usable date.

        **Date extraction behavior**
        - The endpoint prefers parsed mail headers such as `Date` when available.
        - It then falls back to known metadata timestamp fields such as `sent_date`, `date`, `received_at`, `created_at`, `timestamp`, and related keys.
        - All date bucketing is performed in UTC.

        **Campaign grouping heuristic**
        - Campaign bands are inferred by grouping records that share the same normalized `sourceRefs` set.
        - `sourceRefs` are parsed defensively from arrays or string-encoded lists, de-duplicated, sorted, and then used as the grouping key.
        - This is a heuristic, not a guaranteed campaign identifier. Reused or noisy `sourceRefs` may merge unrelated messages into the same displayed band.
      summary: Get mail volume for the last 15 days with inferred campaign windows
      tags:
      - Campaigns
      security:
      - knoxApiToken: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignMailVolumeResponse'
              examples:
                MailVolumeResponse:
                  value:
                    dates:
                    - '2026-03-02'
                    - '2026-03-03'
                    - '2026-03-04'
                    non_danger:
                    - 4
                    - 7
                    - 3
                    dangerous:
                    - 1
                    - 0
                    - 2
                    campaigns:
                    - name: sender-domain-a, subject-cluster-1
                      start: '2026-03-02T00:00:00Z'
                      end: '2026-03-04T23:59:59.999999Z'
                  summary: Mail volume response
          description: Daily UTC mail volume and campaign date bands inferred from
            shared `sourceRefs`.
  /api/campaigns/pca/:
    get:
      operationId: campaign_pca
      description: |-
        Return a two-dimensional PCA projection of a deterministic sample of embeddings from the current Chroma collection.

        **Label semantics**
        - Point `label` is the normalized uppercase value of the metadata `classification` field.
        - Unlike the counts endpoint, this endpoint does **not** fold `SUSPICIOUS` into `UNWANTED`; labels are exposed as stored after normalization.

        **Sampling behavior**
        - The endpoint does **not** fetch all embeddings first.
        - It first walks collection IDs, then selects a deterministic subset up to `limit` using a stable hash of the Chroma record ID.
        - The same collection contents and `limit` produce the same sample order.
        - After sampling, embeddings are grouped by vector dimensionality and PCA is run only on the largest dimension bucket to avoid mixing incompatible embeddings.

        **Numerical behavior**
        - PCA is computed with centered vectors and SVD in float64.
        - `explained_variance` contains the variance ratios for PC1 and PC2.
        - If only one usable dimension exists, PC2 is returned as zero.
      summary: Get a 2D PCA projection of sampled embeddings
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: 'Maximum number of records to sample before PCA. Default: 1500.
          Maximum: 5000.'
      tags:
      - Campaigns
      security:
      - knoxApiToken: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignPcaResponse'
              examples:
                PCAResponse:
                  value:
                    explained_variance:
                    - 0.37
                    - 0.18
                    points:
                    - x: -2.14
                      y: 0.88
                      label: SAFE
                      suspicious_case_id: '1234'
                      sourceRefs:
                      - sender-domain-a
                      - subject-cluster-1
                    - x: 1.27
                      y: -0.42
                      label: SUSPICIOUS
                      suspicious_case_id: '1250'
                      sourceRefs:
                      - sender-domain-b
                  summary: PCA response
          description: PCA projection points and explained variance ratios for PC1
            and PC2.
