components:
  schemas:
    AnalyzerSettings:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        weight:
          type: number
          format: double
        analyzer_cortex_id:
          type: string
          maxLength: 50
        is_active:
          type: boolean
      required:
      - analyzer_cortex_id
      - id
      - name
    AnalyzerWeightUpdate:
      type: object
      properties:
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
      required:
      - weight
    BlankEnum:
      enum:
      - ''
    CampaignClassificationCounts:
      type: object
      properties:
        SAFE:
          type: integer
          minimum: 0
        UNWANTED:
          type: integer
          minimum: 0
        DANGEROUS:
          type: integer
          minimum: 0
      required:
      - DANGEROUS
      - SAFE
      - UNWANTED
    CampaignMailVolumeBand:
      type: object
      properties:
        name:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      required:
      - end
      - name
      - start
    CampaignMailVolumeResponse:
      type: object
      properties:
        dates:
          type: array
          items:
            type: string
            format: date
        non_danger:
          type: array
          items:
            type: integer
            minimum: 0
        dangerous:
          type: array
          items:
            type: integer
            minimum: 0
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/CampaignMailVolumeBand'
      required:
      - campaigns
      - dangerous
      - dates
      - non_danger
    CampaignPcaPoint:
      type: object
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        label:
          type: string
        suspicious_case_id:
          type: string
          nullable: true
        mail_subject:
          type: string
          nullable: true
        sourceRefs:
          type: array
          items:
            type: string
      required:
      - label
      - x
      - y
    CampaignPcaResponse:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/CampaignPcaPoint'
        explained_variance:
          type: array
          items:
            type: number
            format: double
          maxItems: 2
          minItems: 2
      required:
      - explained_variance
      - points
    ChallengeProposedResultEnum:
      enum:
      - Safe
      - Dangerous
      type: string
      description: |-
        * `Safe` - Safe
        * `Dangerous` - Dangerous
    ClassificationEnum:
      enum:
      - SAFE
      - INCONCLUSIVE
      - UNCHALLENGED
      - ALLOW_LISTED
      - FAILURE
      - SUSPICIOUS
      - DANGEROUS
      type: string
      description: |-
        * `SAFE` - SAFE
        * `INCONCLUSIVE` - INCONCLUSIVE
        * `UNCHALLENGED` - UNCHALLENGED
        * `ALLOW_LISTED` - ALLOW_LISTED
        * `FAILURE` - FAILURE
        * `SUSPICIOUS` - SUSPICIOUS
        * `DANGEROUS` - DANGEROUS
    ConnectorDelivery:
      type: object
      properties:
        id:
          type: integer
        event:
          type: string
        case_id:
          type: integer
          nullable: true
        status:
          type: string
        error:
          type: string
        duration_ms:
          type: integer
        attempt:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
      - attempt
      - case_id
      - created_at
      - duration_ms
      - error
      - event
      - id
      - status
    DashboardDangerCounts:
      type: object
      properties:
        failure:
          type: integer
          minimum: 0
        safe:
          type: integer
          minimum: 0
        inconclusive:
          type: integer
          minimum: 0
        suspicious:
          type: integer
          minimum: 0
        dangerous:
          type: integer
          minimum: 0
        malicious:
          type: integer
          minimum: 0
      required:
      - dangerous
      - failure
      - inconclusive
      - malicious
      - safe
      - suspicious
    DashboardKpis:
      type: object
      properties:
        new_users:
          type: integer
          minimum: 0
        total_reporters:
          type: integer
          minimum: 0
        total_cases:
          type: integer
          minimum: 0
      required:
      - new_users
      - total_cases
      - total_reporters
    DashboardPrefix:
      type: object
      properties:
        label:
          type: string
        value:
          type: integer
          minimum: 0
      required:
      - label
      - value
    DashboardSummaryResponse:
      type: object
      properties:
        month:
          type: integer
          maximum: 12
          minimum: 1
        year:
          type: integer
          minimum: 1
        scope:
          type: string
        kpis:
          $ref: '#/components/schemas/DashboardKpis'
        danger_counts:
          $ref: '#/components/schemas/DashboardDangerCounts'
        top_prefixes:
          type: array
          items:
            $ref: '#/components/schemas/DashboardPrefix'
      required:
      - danger_counts
      - kpis
      - month
      - scope
      - top_prefixes
      - year
    EmailFeederState:
      type: object
      properties:
        enabled:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - enabled
      - updated_at
    EmailFeederStateUpdate:
      type: object
      properties:
        enabled:
          type: boolean
      required:
      - enabled
    HomeDangerCounts:
      type: object
      properties:
        safe:
          type: integer
        inconclusive:
          type: integer
        suspicious:
          type: integer
        dangerous:
          type: integer
      required:
      - dangerous
      - inconclusive
      - safe
      - suspicious
    HomeMonthly:
      type: object
      properties:
        everyone_items:
          type: integer
        scope_items:
          type: integer
        scope_name:
          type: string
          nullable: true
      required:
      - everyone_items
      - scope_items
    HomeSpotlight:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        cta_label:
          type: string
        cta_path:
          type: string
      required:
      - cta_label
      - cta_path
      - description
      - title
    HomeSuggestedScopes:
      type: object
      properties:
        region:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        gbu:
          type: string
          nullable: true
    HomeSummaryResponse:
      type: object
      properties:
        show_scope_modal:
          type: boolean
        monthly:
          $ref: '#/components/schemas/HomeMonthly'
        danger_counts:
          $ref: '#/components/schemas/HomeDangerCounts'
        scope_danger_counts:
          allOf:
          - $ref: '#/components/schemas/HomeDangerCounts'
          nullable: true
        suggested_scopes:
          $ref: '#/components/schemas/HomeSuggestedScopes'
        spotlight:
          $ref: '#/components/schemas/HomeSpotlight'
      required:
      - danger_counts
      - monthly
      - scope_danger_counts
      - show_scope_modal
      - spotlight
      - suggested_scopes
    InvestigationDetails:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reporter_email:
          type: string
          format: email
          readOnly: true
        status:
          type: string
          readOnly: true
        info:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        tests_done:
          type: integer
          readOnly: true
        type:
          type: string
          readOnly: true
        result:
          type: string
          readOnly: true
        is_challengeable:
          type: boolean
        is_challenged:
          type: boolean
        mail_preview_url:
          type: string
          readOnly: true
        analyzer_reports:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        case_infos:
          type: object
          additionalProperties: {}
          readOnly: true
        raw:
          type: object
          additionalProperties: {}
          readOnly: true
        challenge_proposed_result:
          oneOf:
          - $ref: '#/components/schemas/ChallengeProposedResultEnum'
          - $ref: '#/components/schemas/BlankEnum'
        challenge_reason:
          type: string
        reporter_context:
          type: string
        reporter_note:
          type: string
          readOnly: true
      required:
      - analyzer_reports
      - case_infos
      - created_at
      - id
      - info
      - mail_preview_url
      - raw
      - reporter_email
      - reporter_note
      - result
      - status
      - tests_done
      - type
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          readOnly: true
        expiry:
          type: string
          format: date-time
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/LoginUser'
          readOnly: true
      required:
      - expiry
      - token
      - user
    LoginUser:
      type: object
      description: |-
        Minimal user representation embedded in the login response.
        Intentionally lighter than AuthenticatedUserSerializer — the login
        response only needs enough to bootstrap the session.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        groups:
          type: string
          readOnly: true
      required:
      - groups
      - id
      - username
    LogoutResponse:
      type: object
      properties:
        detail:
          type: string
          readOnly: true
      required:
      - detail
    MeResponse:
      type: object
      description: |-
        GET /auth/me/ response — full identity + semantic_colors.
        Subclasses AuthenticatedUserSerializer; no additional fields needed.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        groups:
          type: string
          readOnly: true
        ciso_scope:
          type: string
          readOnly: true
        semantic_colors:
          type: object
          additionalProperties: {}
          readOnly: true
        theme:
          type: string
          description: |-
            Returns the user's saved theme name. Falls back to "graphite" if no
            profile exists yet (new user before first profile creation).
          readOnly: true
        auto_seasonal:
          type: boolean
          description: |-
            Returns the user's auto_seasonal preference.
            Falls back to False so new users get explicit theme control by default.
          readOnly: true
      required:
      - auto_seasonal
      - ciso_scope
      - groups
      - id
      - semantic_colors
      - theme
      - username
    MonthlyCasesSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        suspicious_cases:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        inconclusive_cases:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        failure_cases:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        dangerous_cases:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        safe_cases:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        challenged_cases:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        allow_listed_cases:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        uncategorized_cases:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        spam_cases:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        newsletter_cases:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        classic_phishing_cases:
          type: integer
